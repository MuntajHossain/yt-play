[project]
name = "yt-play"
version = "0.2.0"
description = "Terminal YouTube player with search, playback controls, and playlist support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.0",
    "yt-dlp>=2024.0.0",
    "python-mpv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
